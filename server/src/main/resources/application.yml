server:
  port: 8080

spring:
  application:
    name: pbox-server
  config:
    import: optional:file:./a_run_env/pbox.env[.properties]
  datasource:
    url: ${PBOX_DB_URL}
    username: ${PBOX_DB_USERNAME}
    password: ${PBOX_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    encoding: UTF-8

mybatis:
  configuration:
    map-underscore-to-camel-case: true
