services:
  mysql:
    image: mysql:8
    container_name: pbox-mysql
    restart: unless-stopped
    ports:
      # 宿主端口可用 PBOX_DOCKER_DB_PORT 覆盖，默认 3306
      - "${PBOX_DOCKER_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${PBOX_DB_PASSWORD}
      MYSQL_DATABASE: pbox
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - pbox-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$PBOX_DB_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  pbox:
    build: .
    container_name: pbox-app
    restart: unless-stopped
    depends_on:
      mysql:
        # 等数据库健康后再启动，避免 Flyway 初始化时连不上
        condition: service_healthy
    ports:
      # 宿主端口可用 PBOX_DOCKER_APP_PORT 覆盖，默认 8080
      - "${PBOX_DOCKER_APP_PORT:-8080}:8080"
    environment:
      # 容器内必须用服务名 mysql，不能用 localhost
      PBOX_DB_URL: jdbc:mysql://mysql:3306/pbox?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      PBOX_DB_USERNAME: root
      PBOX_DB_PASSWORD: ${PBOX_DB_PASSWORD}
      TZ: Asia/Shanghai

volumes:
  pbox-mysql-data:
